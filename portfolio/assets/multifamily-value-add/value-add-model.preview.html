function show(){const s=sheets[select.value];table.replaceChildren();table.className=s.gridlines?'gridlines':'';const columns=document.createElement('colgroup');let width=38;const corner=document.createElement('col');corner.style.width='38px';columns.append(corner);for(let c=1;c<=s.cols;c++){const el=document.createElement('col'),w=s.widths[c]??s.defaultWidth;el.style.width=w+'px';width+=w;columns.append(el)}table.append(columns);table.style.width=width+'px';const head=table.createTHead().insertRow();for(let c=0;c<=s.cols;c++){const th=document.createElement('th');th.textContent=c?col(c):'';if(c&&s.widths[c]===0)th.style.display='none';head.append(th)}const body=table.createTBody(),covered=new Set(),merges={};for(const [r,c,r2,c2] of s.merges){merges[r+','+c]=[r2-r+1,c2-c+1];for(let y=r;y<=r2;y++)for(let x=c;x<=c2;x++)if(y!==r||x!==c)covered.add(y+','+x)}for(let r=1;r<=s.rows;r++){const tr=body.insertRow();tr.style.height=(s.heights[r]??s.defaultHeight)+'px';if(s.heights[r]===0)tr.style.display='none';const th=document.createElement('th');th.textContent=r;tr.append(th);for(let c=1;c<=s.cols;c++){const key=r+','+c;if(covered.has(key))continue;const td=tr.insertCell(),v=s.cells[col(c)+r],merge=merges[key];if(merge){td.rowSpan=merge[0];td.colSpan=merge[1]}if(s.widths[c]===0&&!merge)td.style.display='none';if(v){td.className='s'+v.style+(v.number?' number':'');const div=document.createElement('div');div.className='cell';div.textContent=v.text;td.append(div);if(v.formula)td.title='='+v.formula}}}document.querySelector('.grid').scrollTo(0,0)}
select.onchange=show;document.getElementById('zoom').onchange=e=>table.style.zoom=e.target.value;show();
</script></body></html>
